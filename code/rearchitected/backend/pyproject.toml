[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ww-ai-demo-entries-api"
version = "0.1.0"
description = "Python serverless entries API and local development adapter"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.38,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/entries_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"