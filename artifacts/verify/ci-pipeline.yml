trigger: none  # triggered manually via AIDLC

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  - script: |
      cd code/server && npm install
      cd ../client && npm install
    displayName: Install dependencies

  - script: |
      cd code/server && npm run typecheck
      cd ../client && npm run typecheck
    displayName: Typecheck server and client

  - script: |
      mkdir -p $(Build.SourcesDirectory)/artifacts/verify/coverage/server
      cd code/server
      npx vitest run --coverage --coverage.provider=v8 \
        --coverage.reporter=json --coverage.reporter=html --coverage.reporter=text \
        --coverage.reportsDirectory=$(Build.SourcesDirectory)/artifacts/verify/coverage/server \
        --reporter=default --reporter=junit \
        --outputFile.junit=$(Build.SourcesDirectory)/artifacts/verify/test-results-server.xml
    displayName: Server tests with coverage

  - script: |
      mkdir -p $(Build.SourcesDirectory)/artifacts/verify/coverage/client
      cd code/client
      npx vitest run --coverage --coverage.provider=v8 \
        --coverage.reporter=json --coverage.reporter=html --coverage.reporter=text \
        --coverage.reportsDirectory=$(Build.SourcesDirectory)/artifacts/verify/coverage/client \
        --reporter=default --reporter=junit \
        --outputFile.junit=$(Build.SourcesDirectory)/artifacts/verify/test-results-client.xml
    displayName: Client tests with coverage

  - script: |
      cd code/server && npm run build
      cd ../client && npm run build
    displayName: Build server and client

  - script: |
      git config user.email "aidlc-ci@pipeline"
      git config user.name "AIDLC CI"
      git add artifacts/verify/
      git commit -m "ci: publish verify artifacts [skip ci]" || echo "Nothing to commit"
      git push origin HEAD:$(Build.SourceBranch)
    displayName: Commit coverage artifacts back to branch
    condition: always()
    continueOnError: true
